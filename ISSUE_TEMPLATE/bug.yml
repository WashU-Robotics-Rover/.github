name: Bug
description: Something on the rover or in the software failed.
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: subteam
    attributes:
      label: Subteam
      options:
        - software
        - electrical
        - mechanical
        - science
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
